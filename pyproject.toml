[project]
name = "thinknxg_attendance_reconcile"
authors = [{ name = "thinkNXG" }]
description = "Safely reconcile Absent attendance after late shift assignment or delayed biometric sync in thinkNXG HR"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"
hrms = ">=15.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B"]
ignore = ["E501", "B017"]

[tool.ruff.lint.isort]
known-first-party = ["thinknxg_attendance_reconcile"]
known-third-party = ["frappe", "erpnext", "hrms"]
